name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (JAX ${{ matrix.jax }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            jax: "0.4.38"
            numpy: "2.4.6"
          - python: "3.13"
            jax: "0.11.0"
            numpy: "2.5.3"
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]" "jax==${{ matrix.jax }}" "numpy==${{ matrix.numpy }}"
      - run: python -m pip check
      - run: python -m pytest -q
