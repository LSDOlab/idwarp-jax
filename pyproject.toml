[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idwarp-jax"
dynamic = ["version"]
description = "Differentiable inverse-distance-weighted volume mesh deformation in JAX"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
  "jax<0.12.0",
  "numpy<2.6.0",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "idwarp_jax.__version__"}
